version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: iot_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - iot_network
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: iot_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=sosamejia
      - MYSQL_DATABASE=iot_db
      - MQTT_BROKER=mqtt://santiago:sosamejia@iot_emqx:1883
      - HOST=0.0.0.0
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - iot_network
    command: sh -c "npm install && npm run dev"

  mysql:
    image: mysql:latest
    container_name: iot_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=sosamejia
      - MYSQL_DATABASE=iot_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - iot_network

  emqx:
    image: emqx/emqx:latest
    container_name: iot_emqx
    ports:
      - "1883:1883"
      - "8883:8883"
      - "8083:8083"
      - "8084:8084"
      - "18083:18083"
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=0.0.0.0
    networks:
      - iot_network

volumes:
  mysql_data:

networks:
  iot_network:
    name: iot_network
    driver: bridge 